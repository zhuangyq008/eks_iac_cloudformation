AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  EKS 控制面：集群 IAM 角色、KMS 信封加密、控制面日志、API Server 公有+私有端点
  （公有端点带 CIDR 白名单）、Access Entry 鉴权模式。使用客户已有的 VPC 与私有子网。

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: 基础 }
        Parameters: [ProjectName, EnvironmentName, ClusterName, KubernetesVersion]
      - Label: { default: 网络 }
        Parameters: [VpcId, ClusterSubnetIds, ServiceIpv4Cidr]
      - Label: { default: 端点与访问控制 }
        Parameters: [PublicAccessCidrs, AdminPrincipalArn]
      - Label: { default: 安全与日志 }
        Parameters: [EnableSecretsEncryption, ControlPlaneLogTypes]

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
    Default: test
  ClusterName:
    Type: String
    AllowedPattern: '^[0-9A-Za-z][A-Za-z0-9\-_]{0,99}$'
  KubernetesVersion:
    Type: String
    Default: '1.36'
    Description: EKS 版本。1.36 为 2026-09 的默认/最新标准支持版本（标准支持至 2027-08-02）。
  VpcId:
    Type: AWS::EC2::VPC::Id
  ClusterSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      控制面 ENI 所在子网，至少 2 个且分布在 2 个 AZ。使用私有子网。
  ServiceIpv4Cidr:
    Type: String
    Default: 172.20.0.0/16
    Description: Kubernetes Service CIDR，不能与 VPC CIDR 或对端网络重叠。创建后不可修改。
    AllowedPattern: '^(10|172|192)\.\d{1,3}\.\d{1,3}\.\d{1,3}/(1[2-9]|2[0-4])$'
  PublicAccessCidrs:
    Type: CommaDelimitedList
    Description: >-
      允许访问 API Server 公共端点的 CIDR 白名单。写 0.0.0.0/0 表示不限制（不推荐）。
  AdminPrincipalArn:
    Type: String
    Default: ''
    Description: >-
      额外授予 AmazonEKSClusterAdminPolicy 的 IAM 角色/用户 ARN，留空跳过。
      不要填部署本栈的角色本身——它已由 BootstrapClusterCreatorAdminPermissions 自动获得权限，
      重复创建会导致 ResourceInUseException。
  EnableSecretsEncryption:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: 是否新建 KMS CMK 对 etcd 中的 Kubernetes Secret 做信封加密。
  ControlPlaneLogTypes:
    Type: CommaDelimitedList
    Default: 'api,audit,authenticator,controllerManager,scheduler'
    Description: 推送到 CloudWatch Logs 的控制面日志类型。

Conditions:
  UseKms: !Equals [!Ref EnableSecretsEncryption, 'true']
  HasAdminPrincipal: !Not [!Equals [!Ref AdminPrincipalArn, '']]

Resources:
  # ---------------------------------------------------------------- KMS
  SecretsKmsKey:
    Type: AWS::KMS::Key
    Condition: UseKms
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'EKS ${ClusterName} etcd secrets envelope encryption'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowEksClusterRole
            Effect: Allow
            Principal: { AWS: !GetAtt ClusterRole.Arn }
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref EnvironmentName }

  SecretsKmsAlias:
    Type: AWS::KMS::Alias
    Condition: UseKms
    Properties:
      AliasName: !Sub 'alias/eks-${ClusterName}-secrets'
      TargetKeyId: !Ref SecretsKmsKey

  # ---------------------------------------------------------------- 集群 IAM 角色
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ClusterName}-cluster-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: eks.amazonaws.com }
            Action: ['sts:AssumeRole', 'sts:TagSession']
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref EnvironmentName }

  # ---------------------------------------------------------------- 控制面日志组
  # 显式创建以便设置保留期；名称必须与 EKS 约定一致。
  ControlPlaneLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/eks/${ClusterName}/cluster'
      RetentionInDays: 30
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref EnvironmentName }

  # ---------------------------------------------------------------- 集群
  Cluster:
    Type: AWS::EKS::Cluster
    DependsOn: ControlPlaneLogGroup
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig:
        # API_AND_CONFIG_MAP：既支持新的 Access Entry，也兼容仍在读写 aws-auth configmap 的存量工具链
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      ResourcesVpcConfig:
        SubnetIds: !Ref ClusterSubnetIds
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
        PublicAccessCidrs: !Ref PublicAccessCidrs
      KubernetesNetworkConfig:
        IpFamily: ipv4
        ServiceIpv4Cidr: !Ref ServiceIpv4Cidr
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler
      EncryptionConfig: !If
        - UseKms
        - - Provider: { KeyArn: !GetAtt SecretsKmsKey.Arn }
            Resources: [secrets]
        - !Ref AWS::NoValue
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref EnvironmentName }

  # ---------------------------------------------------------------- 额外管理员
  AdminAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: HasAdminPrincipal
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref AdminPrincipalArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: !Sub 'arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy'
          AccessScope: { Type: cluster }

Outputs:
  ClusterName:
    Value: !Ref Cluster
    Export: { Name: !Sub '${AWS::StackName}-ClusterName' }
  ClusterArn:
    Value: !GetAtt Cluster.Arn
    Export: { Name: !Sub '${AWS::StackName}-ClusterArn' }
  ClusterEndpoint:
    Value: !GetAtt Cluster.Endpoint
    Export: { Name: !Sub '${AWS::StackName}-ClusterEndpoint' }
  ClusterOidcIssuerUrl:
    Description: IRSA 用的 OIDC issuer URL
    Value: !GetAtt Cluster.OpenIdConnectIssuerUrl
    Export: { Name: !Sub '${AWS::StackName}-OidcIssuerUrl' }
  ClusterSecurityGroupId:
    Description: EKS 自动创建的集群安全组（节点与 Pod 默认使用，Nacos 放通它即可）
    Value: !GetAtt Cluster.ClusterSecurityGroupId
    Export: { Name: !Sub '${AWS::StackName}-ClusterSecurityGroupId' }
  ClusterRoleArn:
    Value: !GetAtt ClusterRole.Arn
    Export: { Name: !Sub '${AWS::StackName}-ClusterRoleArn' }
  SecretsKmsKeyArn:
    Condition: UseKms
    Value: !GetAtt SecretsKmsKey.Arn
    Export: { Name: !Sub '${AWS::StackName}-SecretsKmsKeyArn' }
  UpdateKubeconfigCommand:
    Value: !Sub 'aws eks update-kubeconfig --region ${AWS::Region} --name ${Cluster}'
