AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  可选扩展：Graviton（arm64）EKS 托管节点组（AL2023 ARM）+ 启动模板（强制 IMDSv2、gp3 加密根卷）+ 节点 IAM 角色。
  与 x86 节点组 20-eks-nodegroup 并存，由 scripts/55-arm-nodegroup.sh 单独部署/删除。
  默认带 taint arch=arm64:NoSchedule，只有显式容忍的 Pod 才会调度上来，避免只有 amd64 镜像的应用误落到 arm 节点。

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: 基础 }
        Parameters: [ProjectName, EnvironmentName, ClusterName, NodeGroupName]
      - Label: { default: 计算 }
        Parameters: [NodeSubnetIds, AmiType, InstanceTypes, CapacityType, DesiredSize, MinSize, MaxSize]
      - Label: { default: 调度隔离 }
        Parameters: [EnableArchTaint, TaintKey, TaintValue]
      - Label: { default: 存储 }
        Parameters: [VolumeSize]

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
    Default: test
  ClusterName:
    Type: String
  NodeGroupName:
    Type: String
    Default: ng-arm64
  NodeSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 工作节点子网（私有子网，至少 2 个 AZ；脚本默认复用 x86 节点组的子网）
  AmiType:
    Type: String
    Default: AL2023_ARM_64_STANDARD
    # 只放 AL2023：Bottlerocket 的系统盘/数据盘设备名与下面启动模板的 /dev/xvda 不同
    AllowedValues: [AL2023_ARM_64_STANDARD]
  InstanceTypes:
    Type: CommaDelimitedList
    Default: 'm8g.large,m7g.large'
    Description: >-
      Graviton 机型列表（必须是 arm64，且 vCPU/内存相同：CAS 按同一规格估算节点容量）。
      ON_DEMAND 按列表顺序优先；SPOT 时多机型可降低中断率。
  CapacityType:
    Type: String
    Default: ON_DEMAND
    AllowedValues: [ON_DEMAND, SPOT]
  DesiredSize:
    Type: Number
    Default: 1
    MinValue: 0
  MinSize:
    Type: Number
    Default: 0
    MinValue: 0
    Description: 0 = 允许 Cluster Autoscaler 缩到 0 台（脚本会给 ASG 打 node-template 标签以支持从 0 扩容）
  MaxSize:
    Type: Number
    Default: 4
    MinValue: 1
  VolumeSize:
    Type: Number
    Default: 80
    MinValue: 30
    Description: 根卷大小 (GiB)。容器镜像都落在根卷，建议 >= 80。
  EnableArchTaint:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: true = 节点带 <TaintKey>=<TaintValue>:NoSchedule，未声明容忍的 Pod 不会调度上来
  TaintKey:
    Type: String
    Default: arch
    AllowedPattern: '^[A-Za-z0-9]([-A-Za-z0-9_./]*[A-Za-z0-9])?$'
  TaintValue:
    Type: String
    Default: arm64
    AllowedPattern: '^[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$'

Conditions:
  UseArchTaint: !Equals [!Ref EnableArchTaint, 'true']

Resources:
  # ---------------------------------------------------------------- 节点 IAM 角色
  # 独立角色（不复用 x86 节点组的）：两个栈可以各自删除，互不影响。
  # API 认证模式下，EKS 会为托管节点组的节点角色自动创建 EC2_LINUX 类型的 Access Entry。
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ClusterName}-${NodeGroupName}-node-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly'
        # 与 x86 节点组一致：CNI 权限放节点角色，避免节点 Ready 前的循环依赖
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref EnvironmentName }

  # ---------------------------------------------------------------- 启动模板
  # 与 20-eks-nodegroup 相同：不指定 ImageId / UserData / 安全组，交给 EKS 按 AmiType 注入
  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ClusterName}-${NodeGroupName}-lt'
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required          # 强制 IMDSv2
          # 1 = 只有 hostNetwork Pod（aws-node / kube-proxy / pod-identity-agent）能访问 IMDS，
          # 普通 Pod 拿不到节点角色凭证（CNI / SSM 权限）。业务 Pod 用 Pod Identity / IRSA 取 AWS 权限。
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        Monitoring:
          Enabled: false
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref VolumeSize
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub '${ClusterName}-${NodeGroupName}' }
              - { Key: Project, Value: !Ref ProjectName }
              - { Key: Environment, Value: !Ref EnvironmentName }
          - ResourceType: volume
            Tags:
              - { Key: Name, Value: !Sub '${ClusterName}-${NodeGroupName}' }
              - { Key: Project, Value: !Ref ProjectName }
          - ResourceType: network-interface
            Tags:
              - { Key: Project, Value: !Ref ProjectName }

  # ---------------------------------------------------------------- 托管节点组
  NodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref ClusterName
      NodegroupName: !Ref NodeGroupName
      NodeRole: !GetAtt NodeRole.Arn
      Subnets: !Ref NodeSubnetIds
      AmiType: !Ref AmiType
      CapacityType: !Ref CapacityType
      InstanceTypes: !Ref InstanceTypes
      LaunchTemplate:
        Id: !Ref NodeLaunchTemplate
        Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber
      ScalingConfig:
        DesiredSize: !Ref DesiredSize
        MinSize: !Ref MinSize
        MaxSize: !Ref MaxSize
      UpdateConfig:
        MaxUnavailablePercentage: 33
      # kubernetes.io/arch=arm64 由 kubelet 自动打，这里不重复
      Labels:
        role: arm64
        project: !Ref ProjectName
        environment: !Ref EnvironmentName
      Taints: !If
        - UseArchTaint
        - - Key: !Ref TaintKey
            Value: !Ref TaintValue
            Effect: NO_SCHEDULE
        - !Ref 'AWS::NoValue'
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName
        # 节点组的 Tags 不会传播到底层 ASG。CAS 从 0 扩容需要的
        # k8s.io/cluster-autoscaler/node-template/* 标签由 55-arm-nodegroup.sh 部署后补到 ASG 上。

Outputs:
  NodeGroupName:
    Value: !Ref NodeGroupName
    Export: { Name: !Sub '${AWS::StackName}-NodeGroupName' }
  NodeRoleArn:
    Value: !GetAtt NodeRole.Arn
    Export: { Name: !Sub '${AWS::StackName}-NodeRoleArn' }
  LaunchTemplateId:
    Value: !Ref NodeLaunchTemplate
    Export: { Name: !Sub '${AWS::StackName}-LaunchTemplateId' }
